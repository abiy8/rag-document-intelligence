<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document intelligence</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1525;color:#e6eef8;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:50px auto;padding:0 24px}h1{font-size:38px;line-height:1.2}h2{font-size:22px}p{color:#b9cadd}.eyebrow{color:#75dfc7;text-transform:uppercase;letter-spacing:2px;font-size:12px}section{background:#13233a;border:1px solid #2b405c;border-radius:14px;padding:24px;margin:22px 0}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #425d7e;border-radius:8px;background:#0c192b;color:#fff;font:inherit}button{padding:12px 22px;background:#75dfc7;color:#10283b;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto;font-size:13px}a{color:#75dfc7}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:600px){.row{grid-template-columns:1fr}h1{font-size:30px}}</style></head><body><main><span class="eyebrow">Abiy Abinet Mamo · Engineering portfolio</span><h1>Document intelligence</h1><p>Index a document, ask a question, and inspect the evidence. The default mode extracts sentences; configure Ollama for local LLM answers.</p><label for="key">API key (if configured)</label><input id="key" type="password" autocomplete="off"><p><a href="/docs">Interactive API documentation</a></p><section><h2>1. Add evidence</h2><label for="name">Document name</label><input id="name" value="retention-policy.txt"><label for="text">Document text</label><textarea id="text" rows="4">Customer support tickets are retained for 90 days. Security audit logs are retained for 365 days.</textarea><button id="ingest">Index text</button><label for="file">Or upload a PDF, TXT or Markdown file (5 MB maximum)</label><input id="file" type="file" accept=".pdf,.txt,.md"><button id="upload">Upload file</button></section><section><h2>2. Ask a question</h2><label for="question">Question</label><input id="question" value="How long are customer support tickets retained?"><button id="query">Find an answer</button></section><section><h2>Result</h2><pre id="result" aria-live="polite">Ready.</pre></section></main><script>const out=document.getElementById('result');async function request(url,options={}){const key=document.getElementById('key').value;options.headers={...(options.headers||{}),...(key?{'X-API-Key':key}:{})};const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw new Error(JSON.stringify(data.detail||data));return data}async function show(fn){out.textContent='Working…';try{out.textContent=JSON.stringify(await fn(),null,2)}catch(e){out.textContent=e.message}}function post(url,data){return request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}document.getElementById('ingest').onclick=()=>show(()=>post('/documents',{name:document.getElementById('name').value,text:document.getElementById('text').value}));document.getElementById('query').onclick=()=>show(()=>post('/query',{question:document.getElementById('question').value,k:3}));document.getElementById('upload').onclick=()=>show(async()=>{const f=document.getElementById('file').files[0];if(!f)throw new Error('Choose a file first');const form=new FormData();form.append('file',f);return request('/upload',{method:'POST',body:form})});</script></body></html>
